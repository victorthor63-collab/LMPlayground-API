
name: Construir APK do Elias

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir-apk:
    name: Compilar aplicativo Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android
        uses: android-actions/setup-android@v3

      - name: Instalar ferramentas Android
        run: |
          sdkmanager "ndk;27.2.12479018" "cmake;3.31.6"

      - name: Preparar Gradle
        run: chmod +x gradlew

      - name: Compilar APK
        run: ./gradlew :app:assembleDebug

      - name: Disponibilizar APK para baixar
        uses: actions/upload-artifact@v4
        with:
          name: Elias-LMPlayground-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
